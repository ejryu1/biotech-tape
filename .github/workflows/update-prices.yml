name: Update Prices

on:
  workflow_dispatch:
  schedule:
    # 21:30 UTC = 06:30 KST (Tue-Sat), after the US close. Backup run at 07:30 KST.
    - cron: "30 21 * * 1-5"
    - cron: "30 22 * * 1-5"

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install pandas yfinance

      - name: Refresh prices
        run: python scripts/update_prices.py

      - name: Commit data
        run: |
          git add data/prices.js
          if git diff --cached --quiet; then
            echo "No price changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update prices"
          git pull --rebase origin main
          git push
