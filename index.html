<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biotech Positioning Tape</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#EDF0F2; --surface:#FFFFFF; --sunk:#F5F7F8; --ink:#15212A; --muted:#5A6A75; --faint:#8A99A3;
  --line:#D5DCE0; --accent:#2E5B87; --accent-soft:#DCE6F0;
  --up:#137A46; --up-soft:#DDF0E5; --down:#C3362C; --down-soft:#F7E1DE; --port:#B7791F;
  --sans:"IBM Plex Sans","IBM Plex Sans KR","Noto Sans KR",system-ui,sans-serif;
  --cond:"IBM Plex Sans Condensed","IBM Plex Sans KR","Arial Narrow",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark; --ground:#0D1317; --surface:#141C22; --sunk:#10171C; --ink:#E3E9ED; --muted:#91A0AA; --faint:#66757F;
  --line:#25313A; --accent:#86AED6; --accent-soft:#1D2E3E;
  --up:#45C283; --up-soft:#15301F; --down:#F06A5E; --down-soft:#3A1C19; --port:#E0A94A;}}
:root[data-theme="dark"]{
  color-scheme:dark; --ground:#0D1317; --surface:#141C22; --sunk:#10171C; --ink:#E3E9ED; --muted:#91A0AA; --faint:#66757F;
  --line:#25313A; --accent:#86AED6; --accent-soft:#1D2E3E;
  --up:#45C283; --up-soft:#15301F; --down:#F06A5E; --down-soft:#3A1C19; --port:#E0A94A;}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;padding:20px 16px 48px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
h1{font-family:var(--cond);font-weight:700;font-size:28px;letter-spacing:-.01em;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.datebox{display:flex;align-items:center;gap:8px;font-family:var(--cond);font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
select,input,textarea,button{font:inherit;color:inherit}
select,input[type=text],input[type=date],textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 9px}
select:focus-visible,input:focus-visible,textarea:focus-visible,button:focus-visible,th:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#dateSel{font-family:var(--mono);font-size:13px;text-transform:none;letter-spacing:0}

.baskets{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.bk{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left}
.bk[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.bk-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.bk-name{font-family:var(--cond);font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.05em}
.bk-n{font-family:var(--mono);font-size:12px;color:var(--faint)}
.bk-stats{display:flex;gap:18px;font-variant-numeric:tabular-nums}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--mono);font-size:20px;font-weight:600}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-family:var(--cond)}
.strip{display:flex;gap:2px;height:22px;align-items:stretch}
.strip i{flex:1;border-radius:2px;min-width:3px}
.adv{font-size:12px;color:var(--muted);font-family:var(--mono)}

.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;font-family:var(--cond);font-weight:600;font-size:13px;letter-spacing:.03em;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer}
.chk input{accent-color:var(--port)}
#q{width:170px}
.spacer{flex:1}
.count{font-size:12px;color:var(--faint);font-family:var(--mono)}

.tablebox{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:980px;font-variant-numeric:tabular-nums}
th{position:sticky;top:0;background:var(--sunk);font-family:var(--cond);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
th.r,td.r{text-align:right}
th[aria-sort="ascending"]::after{content:" ▲";color:var(--accent)}
th[aria-sort="descending"]::after{content:" ▼";color:var(--accent)}
td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--sunk)}
.tk{font-family:var(--mono);font-weight:600}
.tk .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--port);margin-left:6px;vertical-align:middle}
.nm{color:var(--muted);max-width:220px;overflow:hidden;text-overflow:ellipsis}
.pill{font-family:var(--cond);font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.pill.long{color:var(--up);border-color:currentColor}
.pill.short{color:var(--down);border-color:currentColor}
.pill.battle{color:var(--accent);border-color:currentColor}
.chgcell{display:flex;align-items:center;justify-content:flex-end;gap:8px}
.bar{width:64px;height:10px;position:relative;background:var(--sunk);border-radius:2px}
.bar::before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--line)}
.bar i{position:absolute;top:0;bottom:0;border-radius:2px}
.num{font-family:var(--mono);min-width:56px;text-align:right}
.up{color:var(--up)} .dn{color:var(--down)} .flat{color:var(--muted)}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
svg.spark{display:block}

.dot-inline{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--port);margin-right:6px;vertical-align:middle}
.note{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
details{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 16px}
summary{cursor:pointer;font-family:var(--cond);font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:13px;color:var(--muted)}
.addform{display:grid;gap:10px;margin-top:12px;max-width:640px}
.addform textarea{min-height:140px;font-family:var(--mono);font-size:12.5px}
.addform .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{background:var(--accent);color:var(--surface);border:0;border-radius:6px;padding:7px 14px;font-family:var(--cond);font-weight:600;letter-spacing:.03em;cursor:pointer}
.btn[disabled]{opacity:.5;cursor:default}
.msg{font-size:12.5px;color:var(--muted)}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Biotech Positioning Tape</h1>
      <div class="sub">Crowded Longs · Heavily Shorted · Battleground — 종가 기준 <span id="lastSession" class="mono">–</span> · 갱신 <span id="updated" class="mono">–</span></div>
    </div>
    <div class="seg" id="periodSeg" role="group" aria-label="기간">
      <button type="button" data-p="1D" aria-pressed="true">1D</button>
      <button type="button" data-p="1W" aria-pressed="false">1W</button>
      <button type="button" data-p="1M" aria-pressed="false">1M</button>
      <button type="button" data-p="3M" aria-pressed="false">3M</button>
      <button type="button" data-p="YTD" aria-pressed="false">YTD</button>
      <button type="button" data-p="1Y" aria-pressed="false">1Y</button>
    </div>
  </header>

  <section class="baskets" id="baskets" aria-label="바스켓 요약"></section>

  <div class="controls">
    <div class="seg" id="basketSeg" role="group" aria-label="바스켓">
      <button type="button" data-b="all" aria-pressed="true">전체</button>
      <button type="button" data-b="long" aria-pressed="false">Crowded Long</button>
      <button type="button" data-b="short" aria-pressed="false">Heavily Shorted</button>
      <button type="button" data-b="battle" aria-pressed="false">Battleground</button>
    </div>
    <select id="areaSel" aria-label="질환 영역"></select>
    <select id="stageSel" aria-label="개발 단계"></select>
    <label class="chk" for="portOnly"><input type="checkbox" id="portOnly"> 내 포트 종목만</label>
    <input type="text" id="q" placeholder="티커·회사 검색" aria-label="검색">
    <span class="spacer"></span>
    <span class="count" id="count"></span>
  </div>

  <div class="tablebox">
    <table>
      <thead><tr id="head"></tr></thead>
      <tbody id="body"><tr><td class="empty" colspan="14">데이터를 불러오는 중…</td></tr></tbody>
    </table>
  </div>

  <div class="note">
    <div><span class="dot-inline"></span>표시는 내 포트 종목. 등락은 수정주가(배당·분할 반영) 종가 기준이며, 추이는 최근 60거래일 종가입니다.</div>
    <div id="meta"></div>
  </div>
</div>
<script src="data/prices.js"></script>
<script src="app.js"></script>
</body>
</html>
